<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda do Pai</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-screen" class="screen flex-center">
    <form id="login-form" class="card">
      <h2>Agenda Barbearia</h2>
      <p class="subtitle">Acesse para ver os horários</p>
      
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" required placeholder="seu@email.com">
      </div>
      
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-password" required placeholder="******">
      </div>
      
      <button type="submit" id="btn-login" class="btn btn-primary">Entrar</button>
    </form>
  </div>

  <!-- Tela Principal da Agenda -->
  <div id="app-screen" class="screen hidden">
    <!-- Topbar -->
    <header class="header">
      <h1>✂️ Agenda do Pai</h1>
      <button id="btn-logout" class="btn-icon" title="Sair">🚪</button>
    </header>

    <main class="container">
      <!-- Seletor de Data -->
      <div class="date-bar card flex-between">
        <button id="btn-prev-day" class="btn-icon">◀</button>
        <input type="date" id="selected-date">
        <button id="btn-next-day" class="btn-icon">▶</button>
      </div>

      <!-- Métricas / Dashboard Diário -->
      <div class="dashboard-grid">
        <div class="card metric">
          <span class="metric-label">Atendimentos</span>
          <span id="metric-counts" class="metric-value">0 / 0</span>
        </div>
        <div class="card metric">
          <span class="metric-label">Estimativa Hoje</span>
          <span id="metric-revenue" class="metric-value green">R$ 0,00</span>
        </div>
      </div>

      <!-- Lista de Horários -->
      <div class="schedule-section">
        <div class="flex-between section-title">
          <span>Horários do Dia</span>
          <button id="btn-refresh" class="btn-link">🔄 Atualizar</button>
        </div>
        
        <div id="appointments-list" class="appointments-list">
          <!-- Inserido dinamicamente via JS -->
        </div>
      </div>
    </main>

    <!-- Botão Flutuante (+) -->
    <button id="btn-open-modal" class="fab">+</button>

    <!-- Modal de Novo Agendamento -->
    <div id="modal" class="modal-backdrop hidden">
      <div class="modal-content card">
        <h2>Novo Agendamento</h2>
        <form id="appointment-form">
          <div class="field">
            <label>Nome do Cliente</label>
            <input type="text" id="cust-name" required placeholder="Ex: João Silva">
          </div>

          <div class="field">
            <label>Telefone (Opcional)</label>
            <input type="tel" id="cust-phone" placeholder="(88) 99999-9999">
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Serviço</label>
              <input type="text" id="cust-service" required value="Corte Masculino">
            </div>
            <div class="field">
              <label>Horário</label>
              <input type="time" id="cust-time" required value="09:00">
            </div>
          </div>

          <div class="field">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="cust-price" required value="35.00">
          </div>

          <div class="grid-2 modal-actions">
            <button type="button" id="btn-close-modal" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
